# @anteros/cli configuration
# https://github.com/anteros/cli

version: "1"
name: "dnx"

# ===========================================================================
# Global deploy settings
# ===========================================================================
defaults: &defaults
  tag: v1.0.2
  restart: unless-stopped
  healthcheck_grace_period: 30

deploy:
  <<: *defaults
  strategy: rolling        # rolling | recreate | blue-green | canary
  max_unavailable: 1

# ===========================================================================
# SSH defaults (overridable per server)
# ===========================================================================
ssh:
  port: 22
  key_path: ~/.ssh/id_rsa
  timeout: 60

# ===========================================================================
# Server-side settings
#   - install_dir:  where `ros` puts pod files on each server
#   - history_dir:  where `ros` stores per-pod deploy history (for rollback)
#   - alerts:       cron-based monitoring installed by `ros alerts install`
#                   (container + host metrics thresholds)
#   - audit:        webhook called after each deploy / rollback
#   - metrics:      cron-based scraper installed by `ros metrics install`
# ===========================================================================
settings:
  install_dir: /opt/anteros
  history_dir: /var/lib/ros/history

  # --- Metrics scraper (host CPU / memory / disk / containers / system) ----
  metrics:
    schedule: "* * * * *"

    # Simple URL form:
    # endpoint: https://metrics.example.com/v1/import

    # Full form (with custom headers + optional HMAC):
    endpoint:
      url: https://metrics.example.com/v1/import
      headers:
        Authorization: "Bearer ${PUSH_TOKEN}"
      # secret: ${METRICS_SECRET}

    # Static labels added to every metric
    labels:
      env: production
      cluster: dnx

    # System info sub-sections (one line per tick).
    # Omit for all, set to `[]` to disable. Default: all.
    # Available: os, cpu, mem, hostname, uptime, docker
    system:
      - os
      - cpu
      - mem
      - hostname
      - uptime
      - docker

    # Per-source toggles (all default to true)
    # include_host: true
    # include_disk: true
    # include_containers: true
    # include_system: true

    # Note: the host's total CPU is the baseline used to convert CPU%
    # into millicores. Override per server with ROS_CPU_TOTAL_MILLICORES
    # (default: 8000 = 8 cores).

  # --- Audit webhook (deploy / rollback events) ---------------------------
  audit:
    url: https://hooks.slack.com/services/REPLACE/ME/xxx
    # events: [deploy.failed, rollback.completed]
    # url:
    #   url: https://api.example.com/events
    #   headers:
    #     Authorization: "Bearer ${AUDIT_TOKEN}"
    #     X-Tenant: prod

  # --- Alerts (cron-based monitoring: containers + host) ------------------
  alerts:
    schedule: "*/5 * * * *"

    email: ops@example.com

    webhook:
      url: https://hooks.slack.com/services/REPLACE/ME/yyy
      headers:
        Authorization: "Bearer ${ALERT_TOKEN}"
        X-Source: ros
      secret: ${ALERT_SECRET}

    # Filters. If empty, a sensible default set is installed.
    # Types:   health | cpu | mem | disk | stopped | oom
    # source:  host or container (required for cpu/mem/disk)
    filters:
      # ── Container filters ───────────────────────────────────────
      - name: "Container unhealthy"
        type: health
        container: "*"
        duration: 1m

      - name: "API high CPU"
        type: cpu
        container: dnx-api
        threshold: 85
        duration: 5m

      - name: "API high memory"
        type: mem
        container: dnx-api
        threshold: 90
        duration: 5m

      - name: "API OOM killed"
        type: oom
        container: dnx-api
        duration: 0s

      - name: "Container stopped"
        type: stopped
        container: "*"
        duration: 30s

      # ── Host filters (metrics-based) ────────────────────────────
      - name: "Host high CPU"
        type: cpu
        source: host
        threshold: 90
        duration: 5m

      - name: "Host high memory"
        type: mem
        source: host
        threshold: 95
        duration: 5m

      - name: "Root disk full"
        type: disk
        source: host
        mount: "/"
        threshold: 85
        duration: 10m

      # - name: "Any mount full"
      #   type: disk
      #   source: host
      #   # mount: not set → checks ALL mount points
      #   threshold: 90
      #   duration: 5m

# ===========================================================================
# Environments
# ===========================================================================
environments:
  staging:
    servers:
      - ${STAGING_HOST:-root@192.168.20.11}
      - ${STAGING_HOST_2:-root@192.168.20.12}
  production:
    servers:
      - ${PROD_HOST:-root@192.168.30.11}
      - ${PROD_HOST_2:-root@192.168.30.12}
      - ${PROD_HOST_3:-root@192.168.30.13}

# ===========================================================================
# Pods
# ===========================================================================
pods:
  dnx-doc:
    type: web
    driver: flox
    instances: 1
    resources:
      cpu: 500m
      memory: 512Mi
    build:
      local:
        steps:
          - name: Generate static site
            run: bun generate
    artifact:
      source: ./docs
      destination: /opt/anteros/docs/
      include:
        - .output
      exclude:
        - node_modules
      force: true
    containers:
      - name: docs
        ports:
          - "4000:3000"
        healthcheck: /
        restart: always

  dnx-api:
    type: api
    driver: docker
    instances: 3
    resources:
      cpu: "1"
      memory: 1Gi
    depends_on:
      - dnx-db
    containers:
      - name: api
        image: ghcr.io/myorg/dnx-api
        tag: v1.0.2
        healthcheck: /healthz
        restart: unless-stopped
        ports:
          - "3001:3001"
        resources:
          cpu: "2"
          memory: 2Gi
        env:
          NODE_ENV: production
          LOG_LEVEL: info
        env_from:
          - secret: dnx-api-secrets
        artifact:
          source: ./apps/api
          destination: /opt/anteros/api/
          include:
            - .output

  dnx-web:
    type: web
    driver: docker
    instances: 2
    resources:
      cpu: 500m
      memory: 512Mi
    containers:
      - name: web
        image: ghcr.io/myorg/dnx-web
        tag: v1.0.2
        healthcheck: /
        restart: always
        ports:
          - "8080:8080"
        env:
          NODE_ENV: production

# ===========================================================================
# Caddy reverse-proxy routes
# ===========================================================================
proxy:
  routes:
    - domain: dnx.dnax.io
      port: 80
      target: 127.0.0.1
      upstream_port: 4000
      tls: auto

    - domain: api.example.com
      target: 127.0.0.1
      upstream_port: 3001
      tls: auto

    - domain: web.example.com
      target: 127.0.0.1
      upstream_port: 8080
      tls: auto

    - domain: www.example.com
      target: 127.0.0.1
      upstream_port: 8080
      tls: auto
